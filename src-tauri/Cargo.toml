[package]
name = "usher"
version.workspace = true
description = "A macOS menu-bar app that keeps your audio devices in priority order"
license.workspace = true
edition.workspace = true

[lib]
name = "usher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.6"

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.10.2"
log = "0.4.35"

[dev-dependencies]
tempfile = "3.27.0"
serde_json = "1.0.154"

[lints]
workspace = true
