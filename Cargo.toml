[workspace]
resolver = "3"
members = ["crates/usher-core", "crates/usher-coreaudio", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
too_many_lines = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
